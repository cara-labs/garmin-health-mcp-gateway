[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-health-gateway"
version = "1.0.0"
description = "Self-hosted, read-only Garmin health-data MCP gateway for 64-bit Docker hosts"
requires-python = ">=3.12"
dependencies = [
  "garminconnect==0.3.11",
  "mcp==1.29.1",
  "psycopg[binary,pool]==3.3.4",
  "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
garmin-health = "garmin_health_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_health_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
