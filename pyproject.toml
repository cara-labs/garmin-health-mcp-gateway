[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-health-gateway"
version = "1.2.0rc1"
description = "Garmin health and activity MCP gateway with FIT analysis and revisioned feedback"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fitdecode==0.11.0",
  "garminconnect==0.3.11",
  "mcp==1.29.1",
  "psycopg[binary,pool]==3.3.4",
  "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
garmin-health = "garmin_health_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_health_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
